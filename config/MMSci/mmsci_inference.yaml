meta:
  out_root_dir: results/experiments/
  result_dir: MMSCI
  seed: 42
model:
  base_model: Qwen/Qwen2-VL-7B-Instruct
  model_type: "multitit"
  peft_config:
    r: 32
    lora_alpha: 32
    bias: "none"
    target_modules:
      - "v_proj"
      - "k_proj"
      - "down_proj"
      - "o_proj"
      - "gate_proj"
      - "up_proj"
      - "q_proj"
data:
  data_dir_root: data/MMSci/test/
  evaluation_data: "*.json"
  img_dir: data/MMSci/test/images
retriever:
  adapters:
    adapters_dir: data/MMSci/LoRAs/
    adapters: "*"
  db:
    embedding_model_name: "infgrad/jasper_en_vision_language_v1"
    db_path: data/MMSci/db
  params:
    k: 10
    fetch_k: 10
    threshold: 0.0
  permissions: "*"
  no_prediction: False
evaluation:
  eval_args:
    do_sample: False
    max_new_tokens: 1024